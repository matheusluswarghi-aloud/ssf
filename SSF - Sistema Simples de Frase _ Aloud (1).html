    var p = document.body || document.documentElement;

    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

--gray: #cbcbcb;\n  --gray-mid: #8a8a8a;\n\n  --font-head: 'Manrope', system-ui, -apple-system, sans-serif;\n  --font-body: 'Fraunces', Georgia, serif;\n  --font-script: 'Caveat', cursive; /* Michigan Signature substitute */\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml, body {\n  background: var(--black);\n  color: var(--white);\n  font-family: var(--font-body);\n  font-weight: 400;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ========== Page shell ========== */\n\n.page {\n  width: 100%;\n  max-width: 1100px;\n  margin: 0 auto;\n  padding: 80px 64px 120px;\n  position: relative;\n  min-height: 100vh;\n}\n\n.page-marker {\n  position: absolute;\n  top: 32px;\n  right: 64px;\n  font-family: var(--font-head);\n  font-weight: 500;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--gray-mid);\n}\n\n.page-marker .num { color: var(--cyan); }\n\n.page-tag {\n  position: absolute;\n  top: 32px;\n  left: 64px;\n  font-family: var(--font-head);\n  font-weight: 500;\n  font-size: 11px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--gray-mid);\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n.page-tag::before {\n  content: \"\";\n  display: block;\n  width: 28px;\n  height: 1px;\n  background: var(--cyan);\n}\n\n/* ========== Type ========== */\n\nh1, h2, h3, h4 {\n  font-family: var(--font-head);\n  font-weight: 800;\n  line-height: 0.95;\n  letter-spacing: -0.02em;\n}\n\n.eyebrow {\n  font-family: var(--font-head);\n  font-weight: 500;\n  font-size: 12px;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--cyan);\n}\n\n.script {\n  font-family: var(--font-script);\n  font-weight: 500;\n}\n\n/* ========== Reusable chrome ========== */\n\n.divider {\n  height: 1px;\n  background: var(--gray-dark);\n  margin: 32px 0;\n}\n\n.divider-cyan {\n  height: 1px;\n  background: linear-gradient(90deg, var(--cyan) 0%, transparent 100%);\n  margin: 32px 0;\n}\n\n/* Aloud logo mark - the \"A\" with chat balloon */\n.logo-mark {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--font-head);\n  font-weight: 800;\n  font-size: 18px;\n  letter-spacing: 0.04em;\n  color: var(--white);\n}\n.logo-mark .glyph {\n  display: inline-block;\n  width: 28px;\n  height: 28px;\n  position: relative;\n}\n.logo-mark--img {\n  display: inline-block;\n  line-height: 0;\n}\n.logo-mark--img img {\n  display: block;\n  height: 34px;\n  width: auto;\n}\n\n/* Bookmark cyan strip */\n.cyan-strip {\n  display: inline-block;\n  background: var(--cyan);\n  color: var(--black);\n  padding: 6px 14px;\n  font-family: var(--font-head);\n  font-weight: 700;\n  font-size: 11px;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n}\n\n/* ========== Cover ========== */\n\n.cover {\n  min-height: 100vh;\n  display: grid;\n  grid-template-rows: auto 1fr auto;\n  padding: 56px 64px;\n  position: relative;\n  overflow: hidden;\n}\n\n.cover-grid-bg {\n  position: absolute;\n  inset: 0;\n  background-image:\n    linear-gradient(var(--gray-dark) 1px, transparent 1px),\n    linear-gradient(90deg, var(--gray-dark) 1px, transparent 1px);\n  background-size: 80px 80px;\n  opacity: 0.18;\n  mask-image: radial-gradient(ellipse at 70% 30%, black 0%, transparent 70%);\n  -webkit-mask-image: radial-gradient(ellipse at 70% 30%, black 0%, transparent 70%);\n}\n\n.cover-top {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  position: relative;\n  z-index: 2;\n}\n\n.cover-meta {\n  font-family: var(--font-head);\n  font-size: 11px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--gray-mid);\n  text-align: right;\n}\n.cover-meta strong { color: var(--cyan); font-weight: 600; }\n\n.cover-mid {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  align-items: flex-start;\n  position: relative;\n  z-index: 2;\n  padding: 60px 0;\n}\n\n.cover-eyebrow {\n  font-family: var(--font-head);\n  font-weight: 500;\n  font-size: 13px;\n  letter-spacing: 0.32em;\n  text-transform: uppercase;\n  color: var(--cyan);\n  margin-bottom: 36px;\n  display: flex;\n  align-items: center;\n  gap: 16px;\n}\n.cover-eyebrow::before, .cover-eyebrow::after {\n  content: \"\";\n  display: block;\n  height: 1px;\n  width: 48px;\n  background: var(--cyan);\n}\n.cover-eyebrow::after { width: 120px; }\n\n.cover-title {\n  font-family: var(--font-head);\n  font-weight: 900;\n  font-size: clamp(64px, 9vw, 132px);\n  line-height: 0.88;\n  letter-spacing: -0.035em;\n  text-transform: uppercase;\n  color: var(--white);\n  margin-bottom: 28px;\n}\n.cover-title .accent {\n  color: var(--cyan);\n  font-style: italic;\n  font-weight: 800;\n}\n.cover-title .script-line {\n  display: block;\n  font-family: var(--font-script);\n  font-weight: 500;\n  font-size: 0.45em;\n  font-style: normal;\n  text-transform: none;\n  letter-spacing: -0.01em;\n  color: var(--cyan-soft);\n  margin-top: 8px;\n}\n\n.cover-sub {\n  max-width: 640px;\n  font-family: var(--font-body);\n  font-weight: 300;\n  font-size: 22px;\n  line-height: 1.4;\n  color: var(--gray);\n  margin-bottom: 48px;\n}\n.cover-sub em { color: var(--cyan); font-style: italic; }\n\n.cover-cta {\n  display: inline-flex;\n  align-items: center;\n  gap: 14px;\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 12px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--black);\n  background: var(--cyan);\n  padding: 18px 28px;\n  text-decoration: none;\n  border: 1px solid var(--cyan);\n  transition: all 0.18s ease;\n}\n.cover-cta:hover {\n  background: transparent;\n  color: var(--cyan);\n}\n.cover-cta .arrow { font-family: monospace; font-size: 16px; }\n\n.cover-bottom {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-end;\n  position: relative;\n  z-index: 2;\n  padding-top: 48px;\n  border-top: 1px solid var(--gray-dark);\n}\n\n.cover-author {\n  font-family: var(--font-head);\n}\n.cover-author .label {\n  font-size: 10px;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--gray-mid);\n  display: block;\n  margin-bottom: 8px;\n}\n.cover-author .name {\n  font-family: var(--font-script);\n  font-size: 38px;\n  color: var(--white);\n  font-weight: 600;\n  line-height: 1;\n}\n\n.cover-hours {\n  text-align: right;\n}\n.cover-hours .num {\n  font-family: var(--font-head);\n  font-weight: 900;\n  font-size: 90px;\n  line-height: 1;\n  color: var(--cyan);\n  letter-spacing: -0.04em;\n}\n.cover-hours .label {\n  font-family: var(--font-head);\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--gray);\n  display: block;\n  margin-top: 6px;\n}\n\n/* ========== How to use page ========== */\n\n.howto-title {\n  font-size: clamp(48px, 7vw, 96px);\n  text-transform: uppercase;\n  margin: 24px 0 12px;\n  font-weight: 900;\n  letter-spacing: -0.03em;\n}\n.howto-title .accent { color: var(--cyan); font-style: italic; }\n.howto-title .script {\n  display: block;\n  font-size: 0.5em;\n  color: var(--cyan-soft);\n  text-transform: none;\n  font-weight: 500;\n  margin-top: 4px;\n  letter-spacing: -0.01em;\n}\n\n.howto-intro {\n  font-size: 18px;\n  line-height: 1.6;\n  color: var(--gray);\n  max-width: 720px;\n  margin-bottom: 48px;\n}\n\n.howto-steps {\n  list-style: none;\n  counter-reset: step;\n  display: grid;\n  gap: 12px;\n  margin-bottom: 64px;\n}\n.howto-steps li {\n  display: grid;\n  grid-template-columns: 56px 1fr;\n  align-items: start;\n  gap: 20px;\n  padding: 20px 0;\n  border-top: 1px solid var(--gray-dark);\n  counter-increment: step;\n  font-size: 17px;\n  line-height: 1.5;\n  color: var(--white);\n}\n.howto-steps li:last-child { border-bottom: 1px solid var(--gray-dark); }\n.howto-steps li::before {\n  content: counter(step, decimal-leading-zero);\n  font-family: var(--font-head);\n  font-weight: 700;\n  font-size: 14px;\n  color: var(--cyan);\n  letter-spacing: 0.1em;\n  padding-top: 4px;\n}\n\n.legend {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 24px;\n  margin: 40px 0;\n}\n.legend-card {\n  border: 1px solid var(--gray-dark);\n  padding: 28px;\n  background: rgba(255,255,255,0.015);\n}\n.legend-card h4 {\n  font-size: 12px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--cyan);\n  margin-bottom: 18px;\n  font-weight: 600;\n}\n.legend-card .demo-orient {\n  font-family: var(--font-body);\n  font-size: 14px;\n  line-height: 1.7;\n  color: var(--gray);\n}\n.legend-card .demo-sentence {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  align-items: center;\n  margin-top: 14px;\n  font-size: 18px;\n}\n.legend-card .demo-sentence span {\n  padding: 4px 10px;\n  border: 1px dashed var(--gray-dark);\n  position: relative;\n}\n.legend-card .demo-sentence .col-roman {\n  font-family: var(--font-head);\n  font-size: 11px;\n  letter-spacing: 0.2em;\n  color: var(--cyan);\n  border: none;\n  padding: 0;\n  margin-right: 4px;\n}\n\n.tip-block {\n  border-left: 2px solid var(--cyan);\n  padding: 24px 28px;\n  background: rgba(0,255,255,0.03);\n  margin: 32px 0;\n}\n.tip-block .label {\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 11px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--cyan);\n  margin-bottom: 10px;\n}\n.tip-block .body {\n  font-size: 16px;\n  line-height: 1.55;\n  color: var(--white);\n}\n.tip-block em { color: var(--cyan-soft); font-style: italic; }\n\n/* ========== TOC ========== */\n\n.toc-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 0 64px;\n  margin-top: 48px;\n}\n.toc-item {\n  display: grid;\n  grid-template-columns: 32px 1fr auto;\n  align-items: baseline;\n  gap: 16px;\n  padding: 14px 0;\n  border-bottom: 1px solid var(--gray-dark);\n  font-family: var(--font-head);\n  font-size: 18px;\n  text-decoration: none;\n  color: var(--white);\n  transition: color 0.15s, padding 0.15s;\n  font-weight: 500;\n}\n.toc-item:hover {\n  color: var(--cyan);\n  padding-left: 6px;\n}\n.toc-item .idx {\n  font-size: 11px;\n  color: var(--cyan);\n  letter-spacing: 0.18em;\n  font-weight: 600;\n}\n.toc-item .name {\n  text-transform: uppercase;\n  letter-spacing: 0.02em;\n  font-weight: 600;\n}\n.toc-item .pg {\n  font-size: 12px;\n  color: var(--gray-mid);\n  font-family: var(--font-body);\n  letter-spacing: 0.04em;\n}\n\n/* ========== Chapter opening ========== */\n\n.chap-head {\n  margin-bottom: 48px;\n}\n.chap-num {\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 12px;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--cyan);\n  margin-bottom: 16px;\n}\n.chap-title {\n  font-family: var(--font-head);\n  font-weight: 900;\n  font-size: clamp(64px, 9vw, 128px);\n  line-height: 0.88;\n  letter-spacing: -0.035em;\n  text-transform: lowercase;\n  color: var(--white);\n  margin-bottom: 8px;\n}\n.chap-title .accent { color: var(--cyan); font-style: italic; }\n.chap-sub {\n  font-family: var(--font-script);\n  font-size: 28px;\n  color: var(--cyan-soft);\n  margin-top: 8px;\n}\n.chap-desc {\n  font-size: 18px;\n  line-height: 1.55;\n  color: var(--gray);\n  max-width: 720px;\n  margin-top: 24px;\n}\n\n/* Mini orientation (compact, every chapter) */\n.orient-strip {\n  display: grid;\n  grid-template-columns: auto 1fr;\n  gap: 32px;\n  align-items: center;\n  padding: 18px 24px;\n  border: 1px solid var(--gray-dark);\n  margin: 32px 0;\n  background: rgba(255,255,255,0.015);\n}\n.orient-strip .lbl {\n  font-family: var(--font-head);\n  font-size: 10px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--cyan);\n  font-weight: 600;\n  line-height: 1.4;\n}\n.orient-strip .rules {\n  display: flex;\n  gap: 24px;\n  flex-wrap: wrap;\n  font-size: 13px;\n  line-height: 1.5;\n  color: var(--gray);\n}\n.orient-strip .rules em {\n  font-family: var(--font-head);\n  color: var(--cyan);\n  font-style: normal;\n  font-weight: 600;\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  margin-right: 6px;\n}\n\n/* ========== SSF Table ========== */\n\n.ssf-wrap {\n  margin: 40px 0;\n  position: relative;\n}\n\n.ssf-cols {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 16px;\n  margin-bottom: 16px;\n}\n.ssf-col-head {\n  font-family: var(--font-head);\n  font-weight: 700;\n  font-size: 14px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  padding: 10px 0;\n  border-top: 2px solid var(--cyan);\n  color: var(--cyan);\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n}\n.ssf-col-head .roman {\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  color: var(--gray-mid);\n}\n\n.ssf-table {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 0 16px;\n}\n.ssf-col {\n  display: grid;\n  align-content: start;\n  gap: 0;\n}\n.ssf-cell {\n  padding: 12px 12px 12px 30px;\n  border-bottom: 1px solid var(--gray-dark);\n  font-family: var(--font-body);\n  cursor: pointer;\n  transition: background 0.12s;\n  user-select: none;\n  position: relative;\n}\n.ssf-cell .sym {\n  position: absolute;\n  left: 8px;\n  top: 14px;\n  font-size: 14px;\n  line-height: 1;\n  color: var(--white);\n}\n.ssf-cell.active .sym { color: var(--black); }\n/* connection colors */\n.ssf-cell .en.c-pink   { color: #ff3da5; }\n.ssf-cell .en.c-purple { color: #b56bff; }\n.ssf-cell .en.c-orange { color: #ff8a3d; }\n.ssf-cell .en.c-green  { color: #4cd964; }\n.ssf-cell .en.c-blue   { color: #5ac8fa; }\n.ssf-cell .en.c-red    { color: #ff453a; }\n.ssf-cell .en.c-yellow { color: #ffd60a; }\n.ssf-cell .en.c-cyan   { color: #00b8c4; }\n.ssf-cell.active .en.c-pink,\n.ssf-cell.active .en.c-purple,\n.ssf-cell.active .en.c-orange,\n.ssf-cell.active .en.c-green,\n.ssf-cell.active .en.c-blue,\n.ssf-cell.active .en.c-red,\n.ssf-cell.active .en.c-yellow,\n.ssf-cell.active .en.c-cyan { color: var(--black); }\n.ssf-cell:hover {\n  background: rgba(0,255,255,0.06);\n}\n.ssf-cell.active {\n  background: var(--cyan);\n  color: var(--black);\n}\n.ssf-cell.active .pt { color: rgba(20,20,20,0.7); }\n.ssf-cell .en {\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 16px;\n  color: inherit;\n  line-height: 1.2;\n  letter-spacing: -0.005em;\n}\n.ssf-cell .pt {\n  font-family: var(--font-body);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--gray);\n  margin-top: 4px;\n  line-height: 1.3;\n}\n\n/* Builder showing assembled sentence */\n.builder {\n  margin-top: 32px;\n  padding: 20px 24px;\n  border: 1px solid var(--cyan);\n  background: rgba(0,255,255,0.04);\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 10px;\n  min-height: 70px;\n}\n.builder-label {\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 10px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--cyan);\n  margin-right: 12px;\n}\n.builder-chip {\n  background: var(--cyan);\n  color: var(--black);\n  padding: 6px 12px;\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 14px;\n  letter-spacing: -0.005em;\n}\n.builder-empty {\n  color: var(--gray-mid);\n  font-style: italic;\n  font-size: 14px;\n}\n.builder-clear {\n  margin-left: auto;\n  background: transparent;\n  border: 1px solid var(--gray-dark);\n  color: var(--gray);\n  font-family: var(--font-head);\n  font-size: 10px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  padding: 6px 12px;\n  cursor: pointer;\n  transition: all 0.15s;\n}\n.builder-clear:hover {\n  border-color: var(--cyan);\n  color: var(--cyan);\n}\n\n/* ========== Examples block ========== */\n\n.examples {\n  margin: 40px 0;\n  padding: 28px 32px;\n  border: 1px solid var(--gray-dark);\n}\n.examples h4 {\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--cyan);\n  margin-bottom: 18px;\n}\n.examples h4 .script-bit {\n  font-family: var(--font-script);\n  font-size: 22px;\n  color: var(--cyan-soft);\n  text-transform: none;\n  letter-spacing: 0;\n  margin-left: 10px;\n  font-weight: 500;\n}\n.examples ul { list-style: none; display: grid; gap: 14px; }\n.examples li {\n  font-family: var(--font-body);\n  font-size: 16px;\n  line-height: 1.45;\n  display: grid;\n  grid-template-columns: 16px 1fr;\n  gap: 14px;\n}\n.examples li::before {\n  content: \"—\";\n  color: var(--cyan);\n  font-family: var(--font-head);\n  font-weight: 600;\n}\n.examples li .en {\n  font-family: var(--font-head);\n  font-weight: 600;\n  color: var(--white);\n  letter-spacing: -0.005em;\n}\n.examples li .pt {\n  font-style: italic;\n  color: var(--gray);\n  display: block;\n  font-size: 14px;\n  margin-top: 2px;\n}\n\n/* ========== Practice page ========== */\n\n.practice-title {\n  font-size: clamp(56px, 8vw, 110px);\n  text-transform: lowercase;\n  font-weight: 900;\n  letter-spacing: -0.035em;\n  line-height: 0.9;\n  margin: 24px 0 8px;\n}\n.practice-title .script {\n  display: block;\n  font-family: var(--font-script);\n  font-size: 0.42em;\n  color: var(--cyan);\n  font-weight: 500;\n  margin-top: 4px;\n  letter-spacing: -0.01em;\n}\n.practice-intro {\n  font-size: 17px;\n  color: var(--gray);\n  max-width: 640px;\n  margin: 24px 0 40px;\n  line-height: 1.5;\n}\n.practice-lines {\n  display: grid;\n  gap: 20px;\n}\n.practice-line {\n  display: grid;\n  grid-template-columns: 32px 1fr;\n  gap: 20px;\n  align-items: end;\n}\n.practice-line .num {\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  color: var(--cyan);\n  padding-bottom: 14px;\n}\n.practice-line .field {\n  border: none;\n  border-bottom: 1px solid var(--gray-dark);\n  background: transparent;\n  color: var(--white);\n  font-family: var(--font-head);\n  font-weight: 500;\n  font-size: 18px;\n  padding: 8px 0 12px;\n  outline: none;\n  width: 100%;\n  transition: border-color 0.15s;\n}\n.practice-line .field::placeholder {\n  color: var(--gray-mid);\n  font-style: italic;\n  font-weight: 300;\n  font-family: var(--font-body);\n}\n.practice-line .field:focus {\n  border-bottom-color: var(--cyan);\n}\n\n/* ========== Phrasal verb explanation ========== */\n\n.pv-block {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 24px;\n  margin: 32px 0;\n}\n\n.pv-card {\n  border: 1px solid var(--gray-dark);\n  padding: 28px;\n  background: rgba(255,255,255,0.012);\n  display: flex;\n  flex-direction: column;\n  transition: border-color 0.18s;\n}\n.pv-card:hover { border-color: var(--cyan); }\n.pv-card .head {\n  display: flex;\n  align-items: baseline;\n  gap: 14px;\n  margin-bottom: 16px;\n  padding-bottom: 14px;\n  border-bottom: 1px solid var(--gray-dark);\n}\n.pv-card .term {\n  font-family: var(--font-head);\n  font-weight: 800;\n  font-size: 28px;\n  color: var(--cyan);\n  letter-spacing: -0.02em;\n}\n.pv-card .ipa {\n  font-family: var(--font-body);\n  font-style: italic;\n  font-size: 13px;\n  color: var(--gray-mid);\n}\n.pv-card .desc {\n  font-family: var(--font-body);\n  font-size: 15px;\n  line-height: 1.6;\n  color: var(--gray);\n  flex: 1;\n  margin-bottom: 18px;\n}\n.pv-card .ex-label {\n  font-family: var(--font-head);\n  font-weight: 600;\n  font-size: 10px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--cyan-soft);\n  margin-bottom: 10px;\n}\n.pv-card .ex {\n  list-style: none;\n  display: grid;\n  gap: 10px;\n}\n.pv-card .ex li {\n  font-family: var(--font-head);\n  font-weight: 500;\n  font-size: 14px;\n  line-height: 1.4;\n  color: var(--white);\n  padding-left: 14px;\n  position: relative;\n}\n.pv-card .ex li::before {\n  content: \"›\";\n  position: absolute;\n  left: 0;\n  color: var(--cyan);\n  font-weight: 700;\n}\n.pv-card .ex li .pt {\n  display: block;\n  font-family: var(--font-body);\n  font-style: italic;\n  font-weight: 400;\n  font-size: 13px;\n  color: var(--gray);\n  margin-top: 2px;\n}\n\n/* ========== Closing ========== */\n\n.closing {\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  align-items: center;\n  text-align: center;\n  padding: 80px 64px;\n  position: relative;\n}\n.closing-eyebrow {\n  font-family: var(--font-head);\n  font-size: 11px;\n  letter-spacing: 0.32em;\n  text-transform: uppercase;\n  color: var(--cyan);\n  margin-bottom: 32px;\n}\n.closing-title {\n  font-family: var(--font-head);\n  font-weight: 900;\n  font-size: clamp(48px, 7vw, 96px);\n  line-height: 0.9;\n  letter-spacing: -0.03em;\n  text-transform: uppercase;\n  margin-bottom: 24px;\n  max-width: 1000px;\n}\n.closing-title .accent { color: var(--cyan); font-style: italic; }\n.closing-pt {\n  font-family: var(--font-script);\n  font-size: 36px;\n  color: var(--cyan-soft);\n  margin-bottom: 48px;\n}\n.closing-msg {\n  font-size: 18px;\n  line-height: 1.6;\n  color: var(--gray);\n  max-width: 640px;\n  margin-bottom: 64px;\n}\n.closing-share {\n  border: 1px dashed var(--cyan);\n  padding: 20px 32px;\n  font-family: var(--font-body);\n  font-style: italic;\n  font-size: 16px;\n  color: var(--white);\n  margin-bottom: 64px;\n  max-width: 640px;\n}\n.closing-author {\n  font-family: var(--font-script);\n  font-size: 42px;\n  color: var(--white);\n  margin-bottom: 6px;\n}\n.closing-handle {\n  font-family: var(--font-head);\n  font-size: 12px;\n  letter-spacing: 0.22em;\n  color: var(--cyan);\n}\n\n/* ========== Reader navigation (sticky bottom) ========== */\n\n.nav-bar {\n  position: fixed;\n  bottom: 0;\n  left: 0;\n  right: 0;\n  background: rgba(20,20,20,0.92);\n  backdrop-filter: blur(12px);\n  -webkit-backdrop-filter: blur(12px);\n  border-top: 1px solid var(--gray-dark);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 14px 32px;\n  z-index: 50;\n  font-family: var(--font-head);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n}\n.nav-bar button {\n  background: transparent;\n  border: 1px solid var(--gray-dark);\n  color: var(--white);\n  font-family: inherit;\n  font-size: inherit;\n  letter-spacing: inherit;\n  text-transform: inherit;\n  padding: 10px 18px;\n  cursor: pointer;\n  transition: all 0.15s;\n  font-weight: 600;\n}\n.nav-bar button:hover:not(:disabled) {\n  border-color: var(--cyan);\n  color: var(--cyan);\n}\n.nav-bar button:disabled {\n  opacity: 0.3;\n  cursor: not-allowed;\n}\n.nav-progress {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  flex: 1;\n  margin: 0 32px;\n}\n.nav-progress .label {\n  color: var(--gray-mid);\n}\n.nav-progress .label strong { color: var(--cyan); }\n.nav-progress .track {\n  flex: 1;\n  height: 1px;\n  background: var(--gray-dark);\n  position: relative;\n  max-width: 400px;\n}\n.nav-progress .track::after {\n  content: \"\";\n  position: absolute;\n  top: -1px;\n  left: 0;\n  height: 3px;\n  background: var(--cyan);\n  width: var(--p, 0%);\n  transition: width 0.25s;\n}\n\n.nav-jump {\n  background: transparent;\n  border: 1px solid var(--gray-dark);\n  color: var(--white);\n  font-family: var(--font-head);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  padding: 10px 18px;\n  cursor: pointer;\n  font-weight: 600;\n  transition: all 0.15s;\n}\n.nav-jump:hover { border-color: var(--cyan); color: var(--cyan); }\n\n/* TOC overlay */\n.toc-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(20,20,20,0.96);\n  backdrop-filter: blur(8px);\n  z-index: 100;\n  display: none;\n  overflow-y: auto;\n  padding: 80px 64px;\n}\n.toc-overlay.open { display: block; }\n.toc-overlay-head {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  max-width: 1100px;\n  margin: 0 auto 48px;\n}\n.toc-overlay-title {\n  font-family: var(--font-head);\n  font-weight: 900;\n  font-size: 56px;\n  text-transform: uppercase;\n  letter-spacing: -0.03em;\n}\n.toc-overlay-title .accent { color: var(--cyan); font-style: italic; }\n.toc-close {\n  background: transparent;\n  border: 1px solid var(--gray-dark);\n  color: var(--white);\n  font-family: var(--font-head);\n  font-size: 11px;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  padding: 12px 20px;\n  cursor: pointer;\n  font-weight: 600;\n}\n.toc-close:hover { border-color: var(--cyan); color: var(--cyan); }\n.toc-overlay-grid { max-width: 1100px; margin: 0 auto; }\n\n/* Hide all pages except active */\n.book-pages > .page,\n.book-pages > .cover,\n.book-pages > .closing {\n  display: none;\n}\n.book-pages > .active {\n  display: block;\n}\n.book-pages > .closing.active {\n  display: flex;\n}\n\n/* footer rule */\n.page-foot {\n  position: absolute;\n  bottom: 32px;\n  left: 64px;\n  right: 64px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-family: var(--font-head);\n  font-size: 10px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--gray-mid);\n  border-top: 1px solid var(--gray-dark);\n  padding-top: 18px;\n}\n.page-foot .dot { color: var(--cyan); }\n\n@media (max-width: 720px) {\n  .page { padding: 56px 24px 100px; }\n  .page-tag, .page-marker { left: 24px; right: 24px; top: 18px; }\n  .ssf-cols, .ssf-table { grid-template-columns: 1fr 1fr; }\n  .pv-block, .legend { grid-template-columns: 1fr; }\n  .toc-grid { grid-template-columns: 1fr; }\n  .nav-progress { margin: 0 12px; }\n  .cover { padding: 32px 24px; }\n  .page-foot { left: 24px; right: 24px; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<div class=\"book-pages\" id=\"book\">\n\n<!-- ============ COVER ============ -->\n<section class=\"cover active\" data-page=\"cover\" data-screen-label=\"01 Cover\">\n  <div class=\"cover-grid-bg\"><\u002Fdiv>\n\n  <div class=\"cover-top\">\n    <div class=\"logo-mark logo-mark--img\">\n      <img src=\"408c540d-87c6-41b1-a7b1-223562207cc0\" alt=\"Aloud\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cover-mid\">\n    <div class=\"cover-eyebrow\">SSF · E-book Aloud<\u002Fdiv>\n    <h1 class=\"cover-title\">\n      Sistema<br>\n      <span class=\"accent\">Simples<\u002Fspan><br>\n      de Frase<span style=\"color:var(--cyan);\">.<\u002Fspan>\n      <span class=\"script-line\">o método pra quem precisa falar<\u002Fspan>\n    <\u002Fh1>\n    <p class=\"cover-sub\">\n      Um guia interativo para construir frases em inglês <em>do zero<\u002Fem> em 48 horas (ou menos).\n    <\u002Fp>\n    <a class=\"cover-cta\" href=\"#\" id=\"start-btn\">\n      <span>Comece a estudar<\u002Fspan>\n      <span class=\"arrow\">→<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n\n  <div class=\"cover-bottom\">\n    <div class=\"cover-author\">\n      <span class=\"label\">Conteúdo original<\u002Fspan>\n      <span class=\"name\">Matheus Werner<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"cover-hours\">\n      <span class=\"num\">24<\u002Fspan>\n      <span class=\"label\">capítulos práticos<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ HOW TO USE ============ -->\n<section class=\"page\" data-page=\"howto\" data-screen-label=\"02 Como usar\">\n  <span class=\"page-tag\">Introdução<\u002Fspan>\n  <span class=\"page-marker\"><span class=\"num\">02<\u002Fspan> / 28<\u002Fspan>\n\n  <div class=\"cyan-strip\">comece por aqui<\u002Fdiv>\n  <h1 class=\"howto-title\">\n    Como usar<br>\n    <span class=\"accent\">o SSF<\u002Fspan>\n    <span class=\"script\">— em três respiros<\u002Fspan>\n  <\u002Fh1>\n\n  <p class=\"howto-intro\">\n    O <strong style=\"color:var(--cyan);\">Sistema Simples de Frases<\u002Fstrong> é um esqueleto: você combina pedaços de quatro colunas para montar dezenas de frases corretas em inglês. Sem decoreba. Sem pânico.\n  <\u002Fp>\n\n  <ol class=\"howto-steps\">\n    <li>Escolha um capítulo. Cada um foca em <strong>um tema do dia a dia<\u002Fstrong>.<\u002Fli>\n    <li>Leia a tabela das quatro colunas (<strong>I · II · III · IIII<\u002Fstrong>). Cada coluna tem palavras ou expressões.<\u002Fli>\n    <li>Conecte <strong>I + II<\u002Fstrong>, depois <strong>II + III<\u002Fstrong>, depois <strong>III + IIII<\u002Fstrong> — lendo da esquerda para a direita.<\u002Fli>\n    <li>Clique nos blocos para montar uma frase. O painel azul mostra a frase resultante.<\u002Fli>\n    <li>Veja os <strong>exemplos prontos<\u002Fstrong> e os significados detalhados dos <strong>phrasal verbs<\u002Fstrong> abaixo.<\u002Fli>\n    <li>Use a página <em>It’s time to practice<\u002Fem> para escrever pelo menos cinco frases novas.<\u002Fli>\n  <\u002Fol>\n\n  <h3 style=\"font-size:14px; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); font-weight:600; margin-bottom:18px;\">Lógica das colunas<\u002Fh3>\n  <div class=\"legend\">\n    <div class=\"legend-card\">\n      <h4>Conexão<\u002Fh4>\n      <div class=\"demo-orient\">\n        Cada item das colunas tem um <strong style=\"color:var(--cyan)\">símbolo<\u002Fstrong>.<br>\n        Para montar uma frase, escolha um item de <strong style=\"color:var(--white);\">cada coluna<\u002Fstrong> que tenha o <strong style=\"color:var(--cyan)\">mesmo símbolo<\u002Fstrong>.<br>\n        Símbolos disponíveis: <span style=\"color:var(--cyan);font-weight:700;letter-spacing:.15em\">◣ ♥ ● ▲ ◀ ★ ◆<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"demo-sentence\">\n        <span class=\"col-roman\">I<\u002Fspan><span>◣ It was<\u002Fspan>\n        <span class=\"col-roman\">II<\u002Fspan><span>◣ wiped out<\u002Fspan>\n        <span class=\"col-roman\">III<\u002Fspan><span>◣ by<\u002Fspan>\n        <span class=\"col-roman\">IIII<\u002Fspan><span>◣ the flood.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"legend-card\">\n      <h4>Como ler aqui<\u002Fh4>\n      <div class=\"demo-orient\">\n        Toque (ou clique) nos blocos para construir a frase no <strong style=\"color:var(--cyan)\">painel ciano<\u002Fstrong> abaixo da tabela. O sistema só aceita combinar itens de colunas <strong style=\"color:var(--white)\">vizinhas<\u002Fstrong> que compartilham o mesmo símbolo. <em style=\"color:var(--cyan-soft); font-style:italic;\">Erre à vontade<\u002Fem> — é parte do método.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"tip-block\">\n    <div class=\"label\">Dica do Matheus<\u002Fdiv>\n    <div class=\"body\">\n      Tudo que é louvável <em>leva tempo<\u002Fem>. Faça um pouco todo santo dia. Esse é o superpoder de quem aprende de verdade.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TOC ============ -->\n<section class=\"page\" data-page=\"toc\" data-screen-label=\"03 Sumário\">\n  <span class=\"page-tag\">Sumário<\u002Fspan>\n  <span class=\"page-marker\"><span class=\"num\">03<\u002Fspan> / 28<\u002Fspan>\n\n  <div class=\"cyan-strip\">índice de capítulos<\u002Fdiv>\n  <h1 class=\"howto-title\">\n    24 cenas<br>\n    <span class=\"accent\">do dia a dia<\u002Fspan>\n  <\u002Fh1>\n  <p class=\"howto-intro\">\n    Cada capítulo te dá uma tabela SSF, exemplos prontos, explicação detalhada de cada phrasal verb e uma página de prática.\n  <\u002Fp>\n\n  <div class=\"toc-grid\" id=\"toc-grid\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- chapters injected here -->\n<div id=\"chapters-mount\"><\u002Fdiv>\n\n<!-- ============ CLOSING ============ -->\n<section class=\"closing\" data-page=\"closing\" data-screen-label=\"28 Encerramento\">\n  <span class=\"closing-eyebrow\">— fim —<\u002Fspan>\n  <h1 class=\"closing-title\">\n    The superpower of doing<br>\n    <span class=\"accent\">a little every<\u002Fspan> single day\n  <\u002Fh1>\n  <p class=\"closing-pt\">o superpoder de fazer um pouco todo santo dia<\u002Fp>\n  <p class=\"closing-msg\">\n    Tudo que é louvável leva tempo. Curta o processo e seja disciplinado(a) mantendo sua saúde mental — eu acredito em você. <strong style=\"color:var(--cyan);\">Keep up with the good work!<\u002Fstrong>\n  <\u002Fp>\n  <div class=\"closing-share\">\n    Tire um print dessa página e poste no seu story pra eu saber se você gostou do conteúdo :)\n  <\u002Fdiv>\n  <div class=\"closing-author\">Matheus Werner<\u002Fdiv>\n  <div class=\"closing-handle\">@mathwerner<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv><!-- /book -->\n\n<!-- ============ NAV BAR ============ -->\n<div class=\"nav-bar\" id=\"navbar\">\n  <button id=\"prev\">← Anterior<\u002Fbutton>\n  <div class=\"nav-progress\">\n    <span class=\"label\"><strong id=\"page-now\">1<\u002Fstrong> / <span id=\"page-total\">28<\u002Fspan><\u002Fspan>\n    <div class=\"track\" id=\"track\"><\u002Fdiv>\n    <span class=\"label\" id=\"page-name\">Capa<\u002Fspan>\n  <\u002Fdiv>\n  <button class=\"nav-jump\" id=\"toc-btn\">Sumário<\u002Fbutton>\n  <button id=\"next\">Próximo →<\u002Fbutton>\n<\u002Fdiv>\n\n<!-- ============ TOC OVERLAY ============ -->\n<div class=\"toc-overlay\" id=\"toc-overlay\">\n  <div class=\"toc-overlay-head\">\n    <h2 class=\"toc-overlay-title\">Ir para <span class=\"accent\">/<\u002Fspan><\u002Fh2>\n    <button class=\"toc-close\" id=\"toc-close\">✕ Fechar<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"toc-overlay-grid\" id=\"toc-overlay-grid\"><\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"bd023800-2aa8-4fcd-9b19-8f75719e0311\"><\u002Fscript>\n<script src=\"8cfbd7ed-f6d7-4d1e-a81e-d50abd9c1552\"><\u002Fscript>\n<script src=\"06281f3d-c7c8-4809-84da-016f95592171\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
